<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
  <title>MQTT Messenger</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #1a1a2e;
      --surface: #16213e;
      --primary: #0f3460;
      --accent: #e94560;
      --text-primary: #eaeaea;
      --text-secondary: #a0a0a0;
      --msg-sent: #1f4a6b;
      --msg-received: #2a2a4a;
      --connected: #22c55e;
      --disconnected: #ef4444;
      --reconnecting: #eab308;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background-color: var(--surface);
      border-bottom: 1px solid var(--primary);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .app-title {
      font-size: 18px;
      font-weight: bold;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--disconnected);
    }

    .status-dot.connected {
      background-color: var(--connected);
    }

    .status-dot.reconnecting {
      background-color: var(--reconnecting);
      animation: pulse 1s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.5;
      }
    }

    .settings-btn {
      background: none;
      border: none;
      color: var(--text-primary);
      cursor: pointer;
      padding: 8px;
      border-radius: 4px;
      font-size: 14px;
    }

    .settings-btn:hover {
      background-color: var(--primary);
    }

    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .message {
      max-width: 70%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.4;
      word-wrap: break-word;
      white-space: pre-line;
    }

    .message.sent {
      align-self: flex-end;
      background-color: var(--msg-sent);
      border-bottom-right-radius: 4px;
    }

    .message.received {
      align-self: flex-start;
      background-color: var(--msg-received);
      border-bottom-left-radius: 4px;
    }

    .message-meta {
      display: flex;
      gap: 8px;
      margin-bottom: 4px;
      font-size: 11px;
      color: var(--text-secondary);
    }

    .message-sender {
      font-weight: bold;
      color: var(--accent);
    }

    .message-time {
      opacity: 0.7;
    }

    .message-private {
      opacity: 0.7;
      color: #22c55e;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 16px;
      background-color: var(--surface);
      border-top: 1px solid var(--primary);
    }

    .message-input {
      flex: 1;
      background-color: var(--bg);
      border: 1px solid var(--primary);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 14px;
      resize: none;
      min-height: 42px;
      max-height: 100px;
    }

    .message-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .send-btn {
      background-color: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      transition: background-color 0.2s;
    }

    .send-btn:hover {
      background-color: #ff5a75;
    }

    .send-btn:active {
      background-color: #d13a54;
    }

    .send-btn:disabled {
      background-color: var(--primary);
      cursor: not-allowed;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.6);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background-color: var(--surface);
      border-radius: 12px;
      padding: 24px;
      width: 400px;
      max-width: 90%;
    }

    .modal-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .form-input {
      width: 100%;
      background-color: var(--bg);
      border: 1px solid var(--primary);
      border-radius: 6px;
      padding: 10px 12px;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 14px;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      margin-top: 20px;
    }

    .btn {
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      border: none;
    }

    .btn-primary {
      background-color: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      background-color: #ff5a75;
    }

    .btn-secondary {
      background-color: var(--primary);
      color: var(--text-primary);
    }

    .btn-secondary:hover {
      background-color: #1a4a7a;
    }

    .error-text {
      color: var(--disconnected);
      font-size: 12px;
      margin-top: 4px;
    }
  </style>
</head>

<body>
  <div class="header">
    <div class="header-left">
      <span class="app-title">MQTT Messenger</span>
      <div class="status-indicator">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">Disconnected</span>
      </div>
    </div>
    <button class="settings-btn" id="settingsBtn">Settings</button>
  </div>

  <div class="messages-area" id="messagesArea"></div>

  <div class="input-area">
    <textarea class="message-input" id="messageInput" placeholder="Type a message..." rows="1"></textarea>
    <button class="send-btn" id="sendBtn">Send</button>
  </div>

  <div class="modal-overlay" id="settingsModal">
    <div class="modal">
      <div class="modal-title">Settings</div>
      <div class="form-group">
        <label class="form-label">MQTT Broker URL</label>
        <input type="text" class="form-input" id="brokerUrl" placeholder="mqtt://localhost:1883">
      </div>
      <div class="form-group">
        <label class="form-label">Subscribe Topic</label>
        <input type="text" class="form-input" id="subscribeTopic" placeholder="chat/subscribe">
      </div>
      <div class="form-group">
        <label class="form-label">Publish Topic</label>
        <input type="text" class="form-input" id="publishTopic" placeholder="chat/publish">
      </div>
      <div class="form-group">
        <label class="form-label">Self Address</label>
        <input type="text" class="form-input" id="username" placeholder="!aabbccdd">
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="cancelSettings">Cancel</button>
        <button class="btn btn-primary" id="saveSettings">Save</button>
      </div>
    </div>
  </div>

  <script>
    const messagesArea = document.getElementById('messagesArea');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsModal = document.getElementById('settingsModal');
    const saveSettings = document.getElementById('saveSettings');
    const cancelSettings = document.getElementById('cancelSettings');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');

    const brokerUrlInput = document.getElementById('brokerUrl');
    const subscribeTopicInput = document.getElementById('subscribeTopic');
    const publishTopicInput = document.getElementById('publishTopic');
    const usernameInput = document.getElementById('username');

    let currentUsername = 'Anonymous';
    let audioCtx = null;

    function playNotificationSound() {
      console.log("playNotificationSound START");
      if (!audioCtx) {
        console.log("creating AudioContext");
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }

      if (audioCtx.state === 'suspended') {
        audioCtx.resume().then(() => {
          console.log("AudioContext resumed");
          playTone();
        });
      } else {
        playTone();
      }

      function playTone() {
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        oscillator.frequency.value = 800;
        oscillator.type = 'sine';

        gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);

        oscillator.start(audioCtx.currentTime);
        oscillator.stop(audioCtx.currentTime + 0.3);
        console.log("playNotificationSound END");
      }
    }

    function formatTime(timestamp) {
      const date = new Date(timestamp * 1000);
      return date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    }

    function addMessage(data, isOwn = false) {
      console.log(data);
      const messageEl = document.createElement('div');
      messageEl.className = `message ${isOwn ? 'sent' : 'received'}`;

      const metaEl = document.createElement('div');
      metaEl.className = 'message-meta';

      const senderEl = document.createElement('span');
      senderEl.className = 'message-sender';
      senderEl.textContent = data.sender || 'Unknown';

      const timeEl = document.createElement('span');
      timeEl.className = 'message-time';
      timeEl.textContent = formatTime(data.data.timestamp);

      const isPrivate = data.data.to !== 0xFFFFFFFF;

      metaEl.appendChild(senderEl);
      metaEl.appendChild(timeEl);

      if (isPrivate) {
        const privateEl = document.createElement('span');
        privateEl.className = 'message-private';
        privateEl.textContent = "(private)"
        metaEl.appendChild(privateEl);
      }

      const textEl = document.createElement('div');
      textEl.textContent = data.data.payload.text.replace("\n", "\r\n");

      messageEl.appendChild(metaEl);
      messageEl.appendChild(textEl);

      messagesArea.appendChild(messageEl);
      messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    function updateStatus(status, message = '') {
      statusDot.className = 'status-dot';

      let statusLabel = '';
      switch (status) {
        case 'connected':
          statusDot.classList.add('connected');
          statusLabel = 'Connected';
          sendBtn.disabled = false;
          break;
        case 'reconnecting':
          statusDot.classList.add('reconnecting');
          statusLabel = 'Reconnecting...';
          sendBtn.disabled = true;
          break;
        case 'disconnected':
          statusLabel = message || 'Disconnected';
          sendBtn.disabled = true;
          break;
        default:
          statusLabel = status;
      }

      statusText.textContent = statusLabel;
    }

    function openSettings() {
      window.electronAPI.getSettings().then(settings => {
        brokerUrlInput.value = settings.brokerUrl || '';
        subscribeTopicInput.value = settings.subscribeTopic || 'msh/+/json/#';
        publishTopicInput.value = settings.publishTopic || 'msh/2/json/mqtt/write';
        usernameInput.value = settings.username || '!aabbccdd';
        currentUsername = settings.username || '!aabbccdd';
        settingsModal.classList.add('active');
      });
    }

    function closeSettings() {
      settingsModal.classList.remove('active');
    }

    function saveSettingsHandler() {
      const settings = {
        brokerUrl: brokerUrlInput.value.trim(),
        subscribeTopic: subscribeTopicInput.value.trim(),
        publishTopic: publishTopicInput.value.trim(),
        username: usernameInput.value.trim() || '!aabbccdd'
      };

      currentUsername = settings.username;

      window.electronAPI.saveSettings(settings).then(() => {
        closeSettings();
      });
    }

    function sendMessage() {
      const text = messageInput.value.trim();
      if (!text) return;

      window.electronAPI.sendMessage({ text, sender: currentUsername });
      messageInput.value = '';
      messageInput.style.height = 'auto';
    }

    settingsBtn.addEventListener('click', openSettings);
    saveSettings.addEventListener('click', saveSettingsHandler);
    cancelSettings.addEventListener('click', closeSettings);

    settingsModal.addEventListener('click', (e) => {
      if (e.target === settingsModal) {
        closeSettings();
      }
    });

    sendBtn.addEventListener('click', sendMessage);

    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    messageInput.addEventListener('input', () => {
      messageInput.style.height = 'auto';
      messageInput.style.height = Math.min(messageInput.scrollHeight, 100) + 'px';
    });

    window.electronAPI.onMessage((data) => {
      console.log(data);
      const isOwn = data.senderId === parseInt(currentUsername.substring(1), 16);
      addMessage(data, isOwn);

      if (!isOwn && !document.hasFocus()) {
        playNotificationSound();
      }
    });

    window.electronAPI.onStatusChange(({ status, message }) => {
      updateStatus(status, message);
    });

    window.electronAPI.getSettings().then(settings => {
      currentUsername = settings.username || '!aabbccdd';
    });

    updateStatus('disconnected');
  </script>
</body>

</html>
